<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Misty - Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #10151f;
        color: #f4f4f4;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        max-width: 32rem;
        margin: 2rem;
        padding: 1.5rem;
        border-radius: 0.75rem;
        border: 1px solid #2e3b54;
        background: #1b2434;
      }
      h1 {
        margin-top: 0;
      }
      button {
        margin-top: 1rem;
        border: 0;
        border-radius: 0.5rem;
        padding: 0.6rem 1rem;
        background: #5271ff;
        color: white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You are offline</h1>
      <p>Misty needs a connection for live game state. Reconnect and try again.</p>
      <button onclick="window.location.reload()">Retry</button>
    </main>
  </body>
</html>
